[project]
name = "my-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jiangjifei", email = "956123364@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.143.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
my-project = "my_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
